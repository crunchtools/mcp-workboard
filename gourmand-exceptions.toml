# print() calls here are direct CLI/terminal UX for an interactive login flow
# (progress messages, browser-open notice) — distinct in purpose from the
# module's logger, which handles diagnostic/library logging (TokenStore
# load/save). Routing user-facing CLI prompts through logging would misdirect
# them: log output is not configured or guaranteed to reach the terminal.
[[exceptions]]
check = "print_alongside_logger"
path = "src/mcp_workboard_crunchtools/auth.py"
justification = "print() statements are user-facing CLI progress messages in the interactive `login` subcommand flow, not diagnostic output; the module's logger (TokenStore) serves a separate purpose"
classification = "by_design"

# Recovers by falling through: current_value stays None, and the downstream
# decrease-warning check (`if current_value is not None and ...`) treats a
# missing current value as "skip the check" rather than failing the update.
[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_workboard_crunchtools/tools/objectives.py"
justification = "Handler recovers by leaving current_value as None; the downstream decrease-warning check already treats None as 'skip', so the key-result update proceeds without the optional audit warning instead of failing"
classification = "by_design"

# BaseHTTPRequestHandler.log_message is overridden with `pass` specifically to
# silence http.server's default per-request access logging to stderr; the
# empty body IS the fix, not leftover scaffolding.
[[exceptions]]
check = "vestigial_code"
path = "src/mcp_workboard_crunchtools/auth.py"
justification = "log_message override with an empty body is the standard http.server idiom for suppressing default per-request access logging"
classification = "by_design"

# gourmand's construction-site analysis looks for `_CallbackHandler(...)` call
# syntax; the actual construction happens inside HTTPServer.__init__, which
# instantiates the handler class per-request from the class object it was
# given. Passing a class as a handler factory to http.server is the standard
# library's own idiom, not dead code.
[[exceptions]]
check = "dead_structs"
path = "src/mcp_workboard_crunchtools/auth.py"
justification = "_CallbackHandler is passed by reference to HTTPServer(...), which instantiates it internally per-request per the http.server API — gourmand's static analysis does not see this indirect construction"
classification = "gourmand_bug"

# run_login_flow and _CallbackHandler.do_GET share no real logic: one parses
# an inbound HTTP GET's query string and stores state on the server; the
# other builds an outbound OAuth authorize URL and exchanges a code via
# httpx. The 87% similarity score is a coincidence of both functions using
# short if-chains over dict-like values with similar variable-naming shape.
[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_workboard_crunchtools/auth.py"
justification = "run_login_flow (OAuth orchestration) and _CallbackHandler.do_GET (HTTP callback parsing) implement unrelated logic; the similarity score is a false positive from superficially similar if-chain shape and variable naming, not duplicated logic"
classification = "gourmand_bug"

